name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows defaults to core.autocrlf=true, which rewrites LF to CRLF on checkout. The
      # byte-comparison tests then see different bytes than on Linux/macOS. Configure it before
      # checkout so every runner gets the same worktree.
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24)
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run knowledge:check
      - run: npm run knowledge:normalize
      - name: Windows PowerShell installer regression
        if: runner.os == 'Windows'
        run: npm run test:windows
